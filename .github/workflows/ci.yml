name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      # The S3 adapter's integration test needs a real endpoint, and fails
      # rather than skips in CI when STORAGE_TEST_ENDPOINT is unset. Same
      # server and development credentials as fiap-x-platform's compose
      # (AD-014). The test defaults to those credentials and creates its
      # own bucket.
      - name: Start RustFS for the storage integration test
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=fiapx-dev -e RUSTFS_SECRET_KEY=fiapx-dev-secret \
            rustfs/rustfs:1.0.0
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 1
          done
          docker logs storage
          exit 1
      - run: npm run test:e2e
        env:
          STORAGE_TEST_ENDPOINT: http://localhost:9000
      - run: npm run build
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Builds linux/amd64 and linux/arm64 on every run; pushes to GHCR only on
  # a push to main, as :<sha> and :main (the tag the local kind cluster pulls,
  # fiap-x-platform AD-018). Pull requests build without pushing. The job
  # authenticates with the workflow's GITHUB_TOKEN, never a personal token.
  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the container image (push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/tech-challenge-workshop/fiap-x-api:${{ github.sha }}
            ghcr.io/tech-challenge-workshop/fiap-x-api:main
          labels: |
            org.opencontainers.image.source=https://github.com/tech-challenge-workshop/fiap-x-api
